id: isaaclab/chemlab-water-activity-temperature
robot: isaaclab/isaaclab-chemlab-instruments
instruction: Power on the water activity meter and bring the indicated temperature
  to 303.15 K, within 0.5 K, for one simulation second.
seed: 0
budget_mode: practice
execution_mode: stepped
stop_on_success: true
backend_kwargs:
  task_name: chemlab-instruments
  max_steps: 6000
  task_spec:
    instruments:
      instrument:
        asset: instrument.aqualab_4te
        initialize: []
    goals:
    - instrument: instrument
      state: thermal.indicated_temperature_k
      min: 302.65
      max: 303.65
    dwell_s: 1.0
