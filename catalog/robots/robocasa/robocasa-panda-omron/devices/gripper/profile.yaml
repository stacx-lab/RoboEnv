name: gripper
type: gripper
intrinsics:
  source: introspected
  method: introspection
  calibrated_at: null
  aperture_m:
    min: 0.0
    max: 0.079
  control:
    mode: direction
    open_target: -1
    close_target: 1
    increment_per_interval: 0.2
  feedback:
    positions:
    - name: gripper0_right_finger_joint1
      units: m
    - name: gripper0_right_finger_joint2
      units: m
    velocities: true
    sensors: []
    clock: simulation
    aperture_model:
      model: affine
      coefficients:
      - 1.0
      - -1.0
      offset_m: -0.001
  stop:
    behavior: hold
    affected_devices:
    - gripper
  frames:
    left_pad: null
    right_pad: null
  geometry:
    description: TCP is grip_site, 97 mm from the flange. Parallel jaws; contact frames
      locate the inner pad surfaces. Contact +Z points toward the object; local XY
      bounds describe each pad, not collision clearance.
    approach_axis:
    - 0
    - 0
    - 1
    closing_axis:
    - 1.0
    - 0.0
    - 0.0
    contacts:
      left_pad:
        frame: left_pad
        size_m:
        - 0.016
        - 0.016
      right_pad:
        frame: right_pad
        size_m:
        - 0.016
        - 0.016
extrinsics:
  source: introspected
  method: introspection
  calibrated_at: null
  mount:
    parent: arm
    parent_frame: flange
    translation_m:
    - 0.0
    - 0.0
    - 0.097
    rotation_xyzw:
    - 0.0
    - 0.0
    - -0.707106781187
    - 0.707106781187
meta:
  created_at: '2026-09-06T00:00:00Z'
  updated_at: '2026-09-08T00:00:00Z'
access:
  source: user
  method: unknown
