  keep_out_zones: []
  notes: Use the supplied device drivers. Each write advances one native control interval.
    Native Panda OSC and torque motors do not define a hard Cartesian or joint velocity
    cap. The base velocity servo limits targets, not measured speed. These safety
    fields explicitly impose no additional velocity cap; native dynamics and
    controller limits still apply.
    Do not infer velocity caps from OSC deltas divided by the control interval or
    from real-hardware URDF limits that this simulator does not enforce.
    Reads and recording do not advance physics. Infer scene geometry and object poses
    from camera images; simulator ground truth is not an agent observation. Budgets
    and verification remain environment-owned.
