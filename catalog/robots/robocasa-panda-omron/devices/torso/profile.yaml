name: torso
type: manipulator
loaded: true
access:
  source: user
  kind: sim
  device: /run/roboenv/sim.sock
  control_mode: position_goal
  driver:
    entry: driver.py
    interpreter: python3
    actions:
    - catalog
    - fk
    - ik
    - load
    - move
    - read
    - state
    - status
    - stop
    - unload
    - write
    timeout_s: 300
intrinsics:
  source: user
  joints:
  - name: torso_lift
    type: prismatic
    limits:
      min: 0.0
      max: 0.35
  actions:
  - component: height
    joint: torso_lift
    units: m
    bounds:
      min: 0.0
      max: 0.35
  dof: 1
  home_joints: ???
  needs_calibration: 'bridge-limited: joint-space IK/FK and true base-to-flange pose are unavailable;
    use documented native Cartesian primitives'
extrinsics:
  source: user
  mount:
    parent: base
    pose: ???
meta:
  created_at: '2026-08-31T03:30:00Z'
  updated_at: '2026-08-31T03:30:00Z'
