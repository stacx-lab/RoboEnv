name: torso
type: manipulator
intrinsics:
  source: introspected
  dof: 1
  joints:
  - name: mobilebase0_joint_torso_height
    type: prismatic
    source: introspected
    limits:
      min: 0.0
      max: 0.34
  actions:
  - component: lift_delta
    units: normalized
    bounds:
      min: -1
      max: 1
    meaning: Native delta target in joint frame; [-1,1] scales to [-0.05,0.05] m per
      interval; not a velocity cap
  control_interval_s: 0.05
  command_expiry: one control interval; other parts receive zero deltas/velocities
  controller:
    name: JointPositionController
    input_type: delta
    input_ref_frame: null
    output_min:
    - -0.05
    output_max:
    - 0.05
  interface: roboenv/manipulator/1
  home_joints:
  - 0.2
  actuators:
  - name: mobilebase0_actuator_torso_height
    joint: mobilebase0_joint_torso_height
    control_limited: true
    control_range:
    - -100000.0
    - 100000.0
    force_limited: false
    force_range:
    - 0.0
    - 0.0
  velocity_limits:
    source: introspected
    measured_joint_velocity_cap: null
    notes: Native model/controller has no hard measured joint velocity cap; controller
      deltas and actuator control ranges are not such a cap.
  kinematics:
    source: MuJoCo compiled model
    fk: mj_kinematics on scratch data
    ik: damped least squares using mj_jacBody; joint limits enforced
    frame: device base
    pose: '[x,y,z,qx,qy,qz,qw]; metres; flange in device base'
    joint_units: m
    implicit_seed: current measured joints projected into limits on scratch data
  joint_limit_semantics:
    source: MuJoCo compiled model jnt_limited/jnt_range
    units: m
    joint_order: intrinsics.joints; same order as read.positions and fk/ik joints
    enforcement: MuJoCo soft joint-limit constraints; measured positions may overshoot
    activation_margin:
    - 0.0
    solver_reference:
    - - 0.02
      - 1.0
    solver_impedance:
    - - 0.9
      - 0.95
      - 0.001
      - 0.5
      - 2.0
    fk_ik: Explicit FK joints and IK seeds must be within limits; IK results are bounded.
      These checks do not guarantee collision-free or reachable motion.
    read: Reports actual joints and flange pose even outside nominal limits
extrinsics:
  source: introspected
  mount:
    parent: body
    pose:
      translation:
      - 0
      - 0
      - 0
      rotation:
      - 0
      - 0
      - 0
      - 1
meta:
  created_at: '2026-09-06T00:00:00Z'
  updated_at: '2026-09-06T00:00:00Z'
access:
  source: user
  kind: url
  url: http://127.0.0.1:8123
  control_mode: joint_delta
  frequency_hz: 20.0
  driver:
    entry: driver.py
    interpreter: python3
    persistent: false
    actions:
    - load
    - unload
    - status
    - read
    - write
    - stop
    - fk
    - ik
