name: base
type: body
loaded: true
access:
  source: user
  kind: sim
  device: /run/roboenv/sim.sock
  control_mode: pose_goal
  driver:
    entry: driver.py
    interpreter: python3
    actions:
    - catalog
    - dock
    - load
    - move
    - read
    - state
    - status
    - stop
    - unload
    - write
    timeout_s: 600
intrinsics:
  source: user
  drive: omni
  turn_in_place: true
  joints: []
  actions:
  - component: x
    units: m
  - component: y
    units: m
  - component: yaw
    units: rad
  mobility: mobile
extrinsics:
  source: user
  mount:
    parent: world
    pose: ???
    dynamic: true
meta:
  created_at: '2026-08-31T03:30:00Z'
  updated_at: '2026-08-31T03:30:00Z'
