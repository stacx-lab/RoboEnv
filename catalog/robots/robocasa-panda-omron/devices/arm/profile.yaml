    fk_ik: Explicit FK joints and IK seeds must be within limits; IK results are bounded.
      These checks do not guarantee collision-free or reachable motion.
    read: Reports actual joints and flange pose even outside nominal limits
    controller: Native OSC accepts 6 Cartesian deltas, not 7 joint targets. Its nullspace
      term attracts joints to the initial posture; it has no explicit joint-range
      avoidance or guaranteed recovery from limits, singularities or contacts.
    recovery: Read measured joints and compare with joints[].limits before further
      motion. stop resets the servo goal without moving home. IK is read-only and
      does not execute recovery; home_joints cannot be passed to this OSC write action.
