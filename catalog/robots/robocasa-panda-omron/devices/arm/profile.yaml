name: arm
type: manipulator
loaded: true
access:
  source: user
  kind: sim
  device: /run/roboenv/sim.sock
  control_mode: cartesian_pose
  driver:
    entry: driver.py
    interpreter: python3
    actions:
    - catalog
    - displace
    - door_close
    - door_open
    - fk
    - ik
    - load
    - move
    - pick
    - place
    - read
    - state
    - status
    - stop
    - unload
    - write
    - invoke
    - policy_run
    timeout_s: 600
intrinsics:
  source: user
  dof: 7
  joints: []
  needs_calibration: 'bridge-limited: joint-space IK/FK and true base-to-flange pose are unavailable;
    use documented native Cartesian primitives'
  home_joints: ???
  actions:
  - component: x
    units: m
  - component: y
    units: m
  - component: z
    units: m
  - component: qx
    units: quaternion
    meaning: write.target uses xyzw; legacy move/native primitives retain wxyz
  - component: qy
    units: quaternion
    meaning: write.target uses xyzw; legacy move/native primitives retain wxyz
  - component: qz
    units: quaternion
    meaning: write.target uses xyzw; legacy move/native primitives retain wxyz
  - component: qw
    units: quaternion
    meaning: write.target uses xyzw; legacy move/native primitives retain wxyz
extrinsics:
  source: user
  mount:
    parent: torso
    pose: ???
