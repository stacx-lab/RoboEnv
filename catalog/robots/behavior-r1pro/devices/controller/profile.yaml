name: controller
type: body
loaded: true
access:
  source: user
  kind: sim
  device: /run/roboenv/sim.sock
  driver:
    entry: driver.py
    interpreter: python3
    actions:
    - read
    - load
    - status
    - unload
    - invoke
    - catalog
    - stop
    timeout_s: 900
intrinsics:
  source: user
  mobility: mobile
  drive: holonomic
  needs_calibration: R1Pro symbolic-primitives tier, not continuous motor control;
    see facts.yaml.
extrinsics:
  source: user
  mount:
    parent: world
    pose: ???
