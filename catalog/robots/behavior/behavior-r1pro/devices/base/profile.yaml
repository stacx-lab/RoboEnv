name: base
type: base
intrinsics:
  source: introspected
  method: introspection
  calibrated_at: null
  mobility: mobile
  control:
    mode: motion
    body_frame: base
    modes:
      drive:
        velocity:
          frame: body
          components:
          - axis: vx
            units: m/s
            bounds:
              min: -0.5
              max: 0.5
          - axis: vy
            units: m/s
            bounds:
              min: -0.5
              max: 0.5
          - axis: wz
            units: rad/s
            bounds:
              min: -1
              max: 1
        posture: null
    execution:
      mode: stepped
      interval_s: 0.03333333333333333
  stop:
    behavior: halt
    affected_devices:
    - base
  feedback:
    pose_frame: world
    velocity_frame: body
    velocity_components:
    - vx
    - vy
    - wz
    clock: simulation
extrinsics:
  source: introspected
access:
  source: user
  method: unknown
  calibrated_at: null
  connection:
    kind: url
    url: http://127.0.0.1:8123
    device: base
  driver:
    entry: driver.py
    interpreter: python3
    persistent: true
    actions:
    - load
    - unload
    - status
    - read
    - write
    - stop
meta:
  created_at: '2026-09-09T00:00:00Z'
  updated_at: '2026-09-09T00:00:00Z'
