name: base
loaded: false
type: base
intrinsics:
  mobility: mobile
  source: introspected
  method: introspection
  calibrated_at: null
  control:
    mode: motion
    body_frame: pelvis
    modes:
      locomotion:
        velocity:
          frame: body
          components:
          - axis: vx
            units: m/s
            bounds:
              min: -0.25
              max: 0.25
          - axis: vy
            units: m/s
            bounds:
              min: -0.15
              max: 0.15
          - axis: wz
            units: rad/s
            bounds:
              min: -0.3
              max: 0.3
        posture:
          reference: ground
          components:
          - axis: height
            units: m
            bounds:
              min: 0.65
              max: 0.8
            default: 0.75
    execution:
      mode: stepped
      interval_s: 0.02
  feedback:
    pose_frame: world
    velocity_frame: base
    velocity_components:
    - vx
    - vy
    - vz
    - wx
    - wy
    - wz
    clock: simulation
  stop:
    behavior: stand
    affected_devices:
    - base
extrinsics:
  source: introspected
  method: introspection
  calibrated_at: null
  frames: []
meta:
  created_at: '2026-09-13T00:00:00Z'
  updated_at: '2026-09-13T00:00:00Z'
access:
  source: user
  method: unknown
  calibrated_at: null
  connection:
    kind: url
    url: http://127.0.0.1:8123
    device: base
  driver:
    entry: driver.py
    interpreter: python3
    persistent: true
    actions:
    - read
    - load
    - unload
    - status
    - write
    - stop
    - batch_write
    - snapshot
    execution_group: base
