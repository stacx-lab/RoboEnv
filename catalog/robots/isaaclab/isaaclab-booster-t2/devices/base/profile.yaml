name: base
type: velocity
loaded: false
access:
  source: user
  method: unknown
  calibrated_at: null
  connection:
    kind: url
    url: http://127.0.0.1:8765
    device: base
  driver:
    entry: driver.py
    persistent: true
    actions:
    - read
    - write
    - stop
    - load
    - unload
    - status
    timeout_s: 60
intrinsics:
  source: introspected
  method: introspection
  calibrated_at: null
  frames:
    trunk:
      parent_frame: null
      translation_m:
      - 0.0
      - 0.0
      - 0.0
      rotation_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
  control:
    mode: motion
    limit_handling: native
    body_frame: trunk
    modes:
      locomotion:
        velocity:
          frame: heading
          components:
          - axis: vx
            units: m/s
            bounds:
              min: -0.5
              max: 1.0
          - axis: vy
            units: m/s
            bounds:
              min: -0.5
              max: 0.5
          - axis: wz
            units: rad/s
            bounds:
              min: -0.5
              max: 0.5
        posture: null
  feedback:
    velocity_frame: base
    velocity_components:
    - vx
    - vy
    - vz
    - wx
    - wy
    - wz
  stop:
    behavior: stand
    affected_devices:
    - base
extrinsics:
  source: introspected
  method: introspection
  calibrated_at: null
meta:
  created_at: '2026-10-20T00:00:00Z'
  updated_at: '2026-10-20T00:00:00Z'
