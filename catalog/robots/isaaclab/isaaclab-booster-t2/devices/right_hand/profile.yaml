    affected_devices:
    - right_hand
  geometry:
    description: "BrainCo Revo2, five fingers. Canonical frame: the center of the\
      \ palm surface, x out of the palm, z toward the fingertips, y toward the thumb.\
      \ The thumb metacarpal (0 to 1.57 rad) swings the thumb from beside the palm,\
      \ pointing along y, to straight out of the palm along x; the thumb proximal\
      \ (0 to 1.03 rad) curls it toward the fingertips. Each finger's proximal joint\
      \ (0 to 1.41 rad) curls it; the distal joints are not actuated and follow their\
      \ proximal joint. Open fingertips lie 8 to 10 cm along z; curled ones stay within\
      \ 3.3 cm of the palm surface. Each joint is position driven with stiffness 3\
      \ N\xB7m/rad, its torque capped at 0.5 N\xB7m for the thumb metacarpal, 1.1\
      \ N\xB7m for the thumb proximal and 2 N\xB7m for each finger: a joint stopped\
      \ by an object presses with stiffness times the remaining target angle, so fingers\
      \ targeted well past contact press the object toward the thumb harder than the\
      \ thumb can hold it, pushing it out of the hand. Points in the canonical frame,\
      \ m, hand open: thumb root (-0.007, 0.020, -0.019); thumb tip (0.000, 0.097,\
      \ -0.001); index knuckle (-0.015, 0.030, 0.034); pinky knuckle (-0.015, -0.029,\
      \ 0.032); index tip (0.008, 0.032, 0.086); middle tip (0.008, 0.011, 0.098);\
      \ pinky tip (0.007, -0.032, 0.079); with the thumb metacarpal at its upper limit\
      \ the thumb tip is at (0.071, 0.013, -0.001). grasp_center (driver FK) weights\
      \ the fingertip pads as SIMPLE does: thumb tip 0.5, index tip 0.25, middle tip\
      \ 0.25; a geometric reference, not a contact measurement."
extrinsics:
  source: introspected
  method: introspection
  calibrated_at: null
  mount:
