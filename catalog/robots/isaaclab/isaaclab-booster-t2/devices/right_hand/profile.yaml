    - name: right_thumb_proximal_joint
      type: revolute
      limits:
        min: 0.0
        max: 1.03
      max_velocity: 2.5303
      max_effort: 1.1
    - name: right_index_proximal_joint
      type: revolute
      limits:
        min: 0.0
        max: 1.41
      max_velocity: 2.2685
      max_effort: 2.0
    - name: right_middle_proximal_joint
      type: revolute
      limits:
        min: 0.0
        max: 1.41
      max_velocity: 2.2685
      max_effort: 2.0
    - name: right_ring_proximal_joint
      type: revolute
