[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roboenv"
version = "0.9.1"
description = "Agent-independent robotics environments, device access and Harbor tasks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
server = ["jsonschema>=4.18"]
setup = ["packaging>=24", "build>=1"]
replay = ["numpy>=1.23"]
dev = ["pytest>=8", "ruff>=0.5", "build>=1"]
harbor = ["harbor==0.22.0; python_version >= '3.12'"]

[project.scripts]
roboenv = "roboenv.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roboenv = ["assets/*.json", "assets/*.py", "assets/*.sh", "assets/*.Dockerfile", "specs/*.json"]
"roboenv.devices.bindings" = ["defaults/*/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-third-party = ["roboenv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_count = 3
tmp_path_retention_policy = "failed"
