[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roboenv-runtime"
version = "0.9.0"
description = "Environment-owned typed simulator devices and journaled worker runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["roboenv[server]==0.9.0", "numpy>=1.23", "PyYAML>=6", "requests>=2.28"]

[project.optional-dependencies]

[project.scripts]
roboenv-worker = "roboenv_runtime.runtime.worker:main"
roboenv-supervise = "roboenv_runtime.runtime.supervisor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roboenv_runtime = ["**/*.yaml", "**/*.json", "**/*.txt"]
