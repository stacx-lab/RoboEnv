# Measured facts about the Panda hand on the RoboCasa rig.  A program reads
# facts["gripper.<key>"]; nothing here may be a constant in code.
- device: gripper
  key: closed_on_nothing_m
  value: 0.010
  unit: m
  measured: 2026-08-27
  by: panda_omron embodiment profile (gripper.closed_on_nothing_m)
  evidence: roboenv/embodiments/panda_omron.yaml
  note: >-
    a close that met no material reads this; Gripper.holding() compares the gap to it
- device: gripper
  key: max_opening_m
  value: 0.085
  unit: m
  measured: 2026-08-27
  by: panda_omron embodiment profile
  evidence: roboenv/embodiments/panda_omron.yaml
- device: gripper
  key: binary
  value: true
  measured: 2026-08-27
  by: panda_omron embodiment profile (measured 2026-08-27)
  evidence: roboenv/embodiments/panda_omron.yaml
  note: >-
    any command < ~0.25 opens fully, >= 0.25 closes fully; there is no partial opening,
    so Gripper.set(gap_m=...) is Unsupported on this rig where LIBERO holds an integrator
- device: gripper
  key: fraction_convention_native
  value: "0.0 = open, 1.0 = closed"
  measured: 2026-08-27
  by: panda_omron embodiment profile (gripper.fraction_convention)
  evidence: roboenv/embodiments/panda_omron.yaml
  note: >-
    the OPPOSITE of the device-interface convention (Gripper.set: 0 closed, 1 open).
    The driver flips it; a program never sees the native sense.
- device: gripper
  key: pad_behind_site_m
  value: 0.012
  unit: m
  measured: 2026-08-27
  by: door-opening campaign (open_door hook seating)
  evidence: roboenv/embodiments/panda_omron.yaml
  note: >-
    seat a bar pinch this deep past the bar's rear face and the pull is carried by the pads
- device: gripper
  key: fingertip_beyond_site_m
  value: 0.011
  unit: m
  measured: 2026-08-27
  by: panda_omron embodiment profile
  evidence: roboenv/embodiments/panda_omron.yaml
- device: gripper
  key: symmetric
  value: true
  measured: 2026-08-27
  by: panda_omron embodiment profile
  evidence: roboenv/embodiments/panda_omron.yaml
  note: >-
    finger axis x and -x are the same grasp; the *_grasp_quat helpers pick the nearer to
    the CURRENT wrist, which is why they are not pure functions
