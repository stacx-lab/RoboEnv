  note: >
    RoboTwin keeps no simulator step counter for the planner layer, so the budget is
    the number of counted TOOL calls (CapxBridge._counted).  A driver that reached past
    adapter.tools() would replay with a different budget_used - which is exactly what
    tools/device_replay.py checks.  The unit flips to sim_steps for the episode as soon
    as something ticks physics directly (the joint layer, or vla_run).
