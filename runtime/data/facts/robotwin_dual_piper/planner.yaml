# The motion planner is a device with a world of its own, and these are the numbers
# that decide how a program must treat it.
- device: planner
  key: budgets_are_wall_clock
  value: true
  measured: 2026-08-26
  by: harness (roboenv/evolve/planner_budget.py)
  evidence: roboenv/evolve/planner_budget.py
  note: >
    THE PLANNER WALL-CLOCK NOTE.  mplib/OMPL stop on planning_time and curobo on a
    timeout, so the outcome of a replayed program depends on how fast the host was
    while it ran.  Every replay must pass --planner-budget deterministic, which pins
    the generous budget AND seeds the OMPL RNG (CAPX_PLANNER_SEED); a loop that hunts
    must then be bounded by a COUNT of motion calls, never by the clock.
- device: planner
  key: rrt_failure_cost_s
  value: [20, 30]
  unit: s
  measured: 2026-08-27
  by: agent robotwin-round3
  evidence: roboenv/embodiments/piper.yaml#planner.rrt_failure_cost_s
  note: a FAILED RRT burns the whole planning budget; a successful plan finishes in < 0.25 s
- device: planner
  key: ik_probe_cost_s
  value: [0.001, 0.03]
  unit: s
  measured: 2026-08-27
  by: agent robotwin-round3
  evidence: roboenv/embodiments/piper.yaml#planner.ik_probe_cost_s
  note: >
    one mplib IK query (20 CLIK seeds, collision-checked) against 20-30 s for a failed
    RRT - which is why planner.probe() sweeps orientations with IK and never with plans
- device: planner
  key: world_is_a_reset_snapshot
  value: [table_6, wall_5, ground_1]
  measured: 2026-08-27
  by: agent robotwin-round3 (get_planner_world read back mid-episode)
  evidence: roboenv/embodiments/piper.yaml#planner.world_is_a_reset_snapshot
  note: >
    each arm's planning world is built inside robot.set_planner(), BEFORE the task
    spawns its props, and is never refreshed.  "Collision-free" means clear of the
    table, the wall and the other arm; a prop in the way and a payload in the jaws are
    both invisible.  planner.avoid(body) adds a prop and IS checked correctly.
- device: planner
  key: attach_payload_is_broken
  value: false
  measured: 2026-08-27
  by: agent robotwin-round3 (carry_in_planner frame check on mplib 0.2.1)
  evidence: roboenv/embodiments/piper.yaml#planner.avoid_in_planner_works_carry_cannot
  note: >
    an ATTACHED body is placed from the arm's BASE-frame pinocchio link pose, so a
    correctly measured relative pose still put a held box a metre away inside wall_5.
    planner.attach() measures this and REFUSES with the numbers rather than planning
    against a lie.  Lift the load clear before travelling instead.
- device: planner
  key: screw_ignores_obstacles
  value: true
  measured: 2026-08-27
  by: agent robotwin-round3
  evidence: roboenv/embodiments/piper.yaml#planner.screw_ignores_obstacles
  note: >
    mplib 0.2's plan_screw skips its own collision check, so Arm.move_to(via="servo")
    reports success and stops where the physics stops it.  Two failure modes behind one
    interface method: Report.note says which one ran.
