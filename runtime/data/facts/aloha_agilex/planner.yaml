# The planner on this rig is mplib, not the curobo the embodiment profile advertises.
- device: planner
  key: budgets_are_wall_clock
  value: true
  measured: 2026-08-26
  by: harness (roboenv/evolve/planner_budget.py)
  evidence: roboenv/evolve/planner_budget.py
  note: >
    THE PLANNER WALL-CLOCK NOTE, and it applies here for the same reason it applies on
    Piper: these envs are registered with planner="mplib_RRT" (the embodiment's own
    curobo kernels do not run on this host), so OMPL's wall-clock planning_time is what
    stops a plan.  Replay with --planner-budget deterministic or a replay is not a replay.
- device: planner
  key: kind
  value: mplib_RRT
  measured: 2026-08-28
  by: roboenv_runtime.adapters.robotwin.embodiments.register_extra_envs
  evidence: roboenv/adapters/robotwin/embodiments.py
  note: >
    config.yml asks for curobo; the registration overrides it ("no kernel image is
    available" for the prebuilt curobo kernels on this host).  So the mplib facts
    measured on Piper - the reset-snapshot planning world, the 20-30 s failed-RRT cost,
    the broken payload attachment - hold on this rig too, and the curobo tuning in the
    embodiment profile does not.
- device: planner
  key: attach_payload_is_broken
  value: false
  measured: 2026-08-28
  by: agent robotwin-hybrid (carry_in_planner on both robots)
  evidence: docs/campaign_2026-08-vla-hybrid/findings.jsonl#ts=2026-08-28T06:20:00
