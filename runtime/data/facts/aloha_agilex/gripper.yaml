# Measured facts about the ALOHA-AgileX grippers.  These are the numbers that differ
# from the Piper rig; a program that reads them instead of writing constants ports
# between the two robots unchanged (stamp_seal and handover_mic already do).
- device: left_gripper
  key: fingertip_floor_z
  value: 0.780
  unit: m
  measured: 2026-08-28
  by: agent robotwin-hybrid (IK sweep over the table, both arms)
  evidence: docs/campaign_2026-08-vla-hybrid/findings.jsonl#ts=2026-08-28T06:10:00
  note: >
    THE FINGERTIP FLOOR.  The ALOHA fingertips have a HARD FLOOR at z = 0.780 over the
    table (table top 0.740) for both arms at every (x, y) probed; 5 mm lower is
    "IK Failed".  Off the table edge the same arm reaches z = 0.55, so the floor is the
    table collision against the arx5 gripper mesh, not the arm's kinematics.  Piper has
    no such floor.  A hand-built pinch stopped at 0.780 grips and lifts a block 9.7 cm;
    stopped at 0.785 it closes on air.
- device: right_gripper
  key: fingertip_floor_z
  value: 0.780
  unit: m
  measured: 2026-08-28
  by: agent robotwin-hybrid (IK sweep over the table, both arms)
  evidence: docs/campaign_2026-08-vla-hybrid/findings.jsonl#ts=2026-08-28T06:10:00
  note: measured on both arms; identical
- device: left_arm
  key: fingertip_floor_z
  value: 0.780
  unit: m
  measured: 2026-08-28
  by: agent robotwin-hybrid (IK sweep over the table, both arms)
  evidence: docs/campaign_2026-08-vla-hybrid/findings.jsonl#ts=2026-08-28T06:10:00
  note: >
    hung on the ARM as well as on the gripper because it is a property of the pair -
    the gripper's collision mesh against the table, reached through this arm.  A rig
    that swapped the gripper would have to re-measure it.
- device: right_arm
  key: fingertip_floor_z
  value: 0.780
  unit: m
  measured: 2026-08-28
  by: agent robotwin-hybrid (IK sweep over the table, both arms)
  evidence: docs/campaign_2026-08-vla-hybrid/findings.jsonl#ts=2026-08-28T06:10:00
- device: left_gripper
  key: grasp_dis_window_m
  value: "fingertip_floor_z - contact_point_z  <  grasp_dis  <  half_size"
  measured: 2026-08-28
  by: agent robotwin-aloha-last3 (blocks_ranking_size, 4/4 certified)
  evidence: docs/campaign_2026-08-vla-hybrid/findings.jsonl#ts=2026-08-28T15:00:00
  note: >
    THE GRASP-WINDOW RULE, in the form that ports.  grasp_dis is decided by the height
    of the ANNOTATED CONTACT POINT and this rig's fingertip floor together, not by the
    object's origin and not by a constant.  Measured: grasp_object(...grasp_dis=0.02)
    plans, closes and verifies where grasp_dis=0.0 raises IK Failed; an asset whose
    window is EMPTY (block3, the coaster, the stapler pad, the mouse at contact z
    0.7592) cannot be grasped by code at all on this rig and belongs to the policy.
    find_grasp's default ladder (0.0, 0.02, 0.04) works here only because of its last
    two rungs - ask it for (0.02, 0.03, 0.04).
- device: right_gripper
  key: grasp_dis_window_m
  value: "fingertip_floor_z - contact_point_z  <  grasp_dis  <  half_size"
  measured: 2026-08-28
  by: agent robotwin-aloha-last3 (blocks_ranking_size, 4/4 certified)
  evidence: docs/campaign_2026-08-vla-hybrid/findings.jsonl#ts=2026-08-28T15:00:00
