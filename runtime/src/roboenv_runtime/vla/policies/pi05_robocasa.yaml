# π0.5 trained by the RoboCasa365 authors on their 300-task human pretraining set
# (65 atomic + 235 composite tasks, 100 demos each): the benchmark's own openpi
# baseline checkpoint (multitask learning, step 75000).  Served by the vendored openpi
# through serve_openpi.py, which registers the fork's config and transforms.
name: pi05_robocasa
simulator: robocasa
protocol: openpi-ws
description: "π0.5 (openpi) multitask checkpoint from RoboCasa365 — trained on 300 kitchen tasks"
interpreter: ${REPO}/third_party/RoboDojo/XPolicyLab/policy/Pi_05/openpi/.venv/bin/python
cwd: ${REPO}/third_party/RoboDojo/XPolicyLab/policy/Pi_05/openpi
argv:
  - -m
  - roboenv_runtime.vla.serve_openpi
  - --config=pi05_pretrain_human300
  - --dir=${REPO}/.cache/vla/robocasa365_checkpoints/pi05_pretrain_human300/multitask_learning/75000
  - --port={port}
env:
  OPENPI_DATA_HOME: ${REPO}/.cache/openpi
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  XLA_PYTHON_CLIENT_MEM_FRACTION: "0.35"
  PYTHONUNBUFFERED: "1"
port_base: 8820
default: true
checkpoint: ${REPO}/.cache/vla/robocasa365_checkpoints/pi05_pretrain_human300/multitask_learning/75000
download: "HF_HOME=${REPO}/.cache/huggingface python -c \"from huggingface_hub import snapshot_download; snapshot_download('robocasa/robocasa365_checkpoints', allow_patterns=['pi05_pretrain_human300/multitask_learning/75000/params/*','pi05_pretrain_human300/multitask_learning/75000/assets/*','pi05_pretrain_human300/multitask_learning/75000/_CHECKPOINT_METADATA'], local_dir='${REPO}/.cache/vla/robocasa365_checkpoints')\""
boot_timeout_s: 900
gpu_mib: 12000
obs:
  cameras: {base: robot0_agentview_left, wrist: robot0_eye_in_hand, right: robot0_agentview_right}
  render_size: 256          # the RoboCasa gym wrapper's camera size
  resize: 224
  rotate180: false
  flip_vertical: true       # the gym wrapper flips robosuite's upside-down obs image before the policy sees it
  state: [base_to_eef_pos, base_to_eef_quat, base_pos, base_quat, gripper_qpos]   # 3+4+3+4+2 = 16
action:
  dim: 12                   # ee pos(3) rot(3) gripper_close(1) base_motion(4: vx vy wz torso) control_mode(1)
  replan_steps: 5
notes: >
  Evaluated by its authors in the benchmark's "pretrain" scenes; our episodes sample
  layouts through reset(seed), so some scenes are outside its training set.  Control
  mode (last action dim) switches the robot between arm and base control the way the
  demonstrations did — the policy decides when to drive.
tool_doc: |
  Hand closed-loop control to a pretrained vision-language-action policy (default
  ``pi05_robocasa``: π0.5 trained by the RoboCasa365 authors on 300 kitchen tasks — the
  benchmark's own multitask baseline) for up to ``n_actions`` control steps (20 Hz, one
  environment step each), then get control back with a before/after report ``{"policy",
  "actions_taken", "reward_before", "reward_after", "objects_moved_m", "budget", "note"}``.

  It sees the three benchmark cameras (left/right shoulder, wrist) and a language
  instruction, drives the base itself, and cannot be told poses.

  **Use the episode's own sentence, unedited.**  RoboCasa's ``lang`` *is* this
  checkpoint's training prompt: trimming six words from one turned a certificate from 1.0
  to 0.0, because the clause carried the orientation the scorer checks.  Its decoys are
  visual, not linguistic — it grabs the distractor pastry whether or not the sentence
  mentions it.  (The opposite of LIBERO, where a goal-derived sentence helps.)

  **One long call, not chunks.**  ``MoveToCounter`` certifies at a single ``vla_run(900)``
  and scores 0.0 when the same 900 frames are spent as six calls of 150 — a chunk boundary
  restarts the plan, which wrecks a transport that was converging.  If you do chunk, use
  ``warmup_frames=600``: this policy drives the base for 300-600 frames before it touches
  anything, and the default stall rule stopped 10 of 16 runs at exactly frame 200.

  **Budget for the finish.**  Ask for ~850 of the 1000-frame horizon and keep ~150 for
  ``open_gripper`` + ``tuck_arm``: ``gripper_obj_far`` is a conjunct 368 times across the
  301 composite checks, the episode does not end at success, and six of nine composite
  certificates were flipped from 0.0 to 1.0 by that retraction alone.  Do **not** reach for
  ``place_gently`` there — it retreats 6 cm and the conjunct wants 0.25 m.

  **Where it is worth calling**: the atomic families it was trained on, and any composite
  that is essentially one transport.  It holds exactly the atomic tasks code cannot afford
  — the coded family program reaches reward 1.0 on five of them and is refused only by the
  horizon.  Composite tasks whose legs sum past ~1000 frames are out of reach for both
  halves; price them before spending an episode.

  **Never hand it a state your code built** — it stalls or re-runs the leg.  The one
  exception measured: staging with the *base and torso only*, arm tucked, and only when
  the policy scores zero unaided.

  The first call boots the policy server (1-3 min, once per process).  Refused when the
  horizon is exhausted.  A certificate that calls this is less reliable than one that does
  not — verify it on a *second server process*.

