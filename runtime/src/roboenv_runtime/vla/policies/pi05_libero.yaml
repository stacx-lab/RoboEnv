# Explicit OpenPI comparison policy; not automatically attached to typed devices.
name: pi05_libero
simulator: libero
protocol: openpi-ws
description: "π0.5 (openpi) fine-tuned on LIBERO spatial/object/goal/10 — Physical Intelligence's public checkpoint"
interpreter: ${REPO}/third_party/RoboDojo/XPolicyLab/policy/Pi_05/openpi/.venv/bin/python
cwd: ${REPO}/third_party/RoboDojo/XPolicyLab/policy/Pi_05/openpi
argv:
  - -m
  - roboenv_runtime.vla.serve_openpi
  - --config=pi05_libero
  - --dir=${REPO}/.cache/openpi/openpi-assets/checkpoints/pi05_libero
  - --port={port}
env:
  OPENPI_DATA_HOME: ${REPO}/.cache/openpi
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  XLA_PYTHON_CLIENT_MEM_FRACTION: "0.35"
  PYTHONUNBUFFERED: "1"
port_base: 8800
default: true
checkpoint: ${REPO}/.cache/openpi/openpi-assets/checkpoints/pi05_libero
download: "OPENPI_DATA_HOME=${REPO}/.cache/openpi <openpi-venv>/python -c \"from openpi.shared import download; download.maybe_download('gs://openpi-assets/checkpoints/pi05_libero')\""
boot_timeout_s: 900
gpu_mib: 10000
obs:
  cameras: {base: agentview, wrist: robot0_eye_in_hand}
  render_size: 256          # LIBERO_ENV_RESOLUTION in openpi's evaluation
  resize: 224
  rotate180: true           # LIBERO's stored images are rotated 180 deg; so is the eval client
  state: [eef_pos, eef_axisangle, gripper_qpos]   # 3 + 3 + 2
action:
  dim: 7                    # OSC_POSE deltas (dx dy dz droll dpitch dyaw) + gripper (-1 open, +1 close)
  replan_steps: 5           # caller consumes this many actions before replanning
  controller: OSC_POSE      # the LIBERO datasets were collected with robosuite's OSC_POSE at 20 Hz
notes: >
  The native LIBERO hook supports explicit synchronous rollouts with a finite
  episode budget. The default device adapter does not attach a VLA tool.
  This checkpoint targets spatial/object/goal/10; libero_90 and modified task suites
  perturbations are outside that training scope. Preserve the benchmark language
  instruction. Local joint-initialized rollouts are not official benchmark scores.
tool_doc: |
  Run pi05_libero for at most n_actions native OSC_POSE intervals, replanning
  every five actions. Each interval counts against the existing episode budget.
  Requires a reset native world with realtime=False, finite max_steps, both
  policy cameras, and the OpenPI interpreter/checkpoint configured above.
  The seven policy values are end-effector pose deltas plus gripper control;
  they are not seven joint angles. The original joint controller is restored
  and holds measured state on completion, cancellation, or inference failure.
  Reported native success is latched; evaluate terminal predicates separately
  if the comparison requires the goal to remain satisfied at episode end.
