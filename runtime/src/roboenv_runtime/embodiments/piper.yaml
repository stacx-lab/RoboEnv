# AgileX Piper dual-arm embodiment as configured in RoboTwin 2.0 (SAPIEN).
simulator: robotwin
description: Two AgileX Piper 6-DoF arms with parallel grippers on opposite sides of a table.
arms: [left, right]

frame:
  quaternion_order: wxyz
  up_axis: z
  table_z: 0.745                 # 0.74-0.75 depending on the scene
  arm_base_xyz:                  # URDF root of each arm, measured 2026-08-27
    left: [-0.30, -0.45, 0.75]
    right: [0.30, -0.45, 0.75]
  arm_side:
    left: x < 0
    right: x > 0

workspace:
  spawn_x: [-0.3, 0.3]
  spawn_y: [-0.2, 0.25]
  handover_zone: near x = 0
  # Measured 2026-08-27 by planning to a grid of end-effector poses in the
  # put_object_cabinet scene. The envelope depends strongly on TOOL PITCH:
  topdown_far_edge_y: -0.10      # with the tool pointing straight down, no
                                 # pose at y > -0.05 planned for either arm
                                 # (and at y = -0.05 only |x| >= 0.10)
  pitch_probe: |
    probe_reach(arm, point, elevations=..., azimuths=..., rolls=...) sweeps the
    dive angle of the approach (90 = straight down) with IK only, no motion.
    Measured in put_object_cabinet seed 0, fingertips on the table's far half:
    elevation 90 fails at every point tried and for both arms, while the left arm
    reaches from 75 and the right from 60 down to 15. The top-down orientation is
    the ONE that fails everywhere - and the only one check_reachable_* tries.
  tilted_reach_note: |
    Pitching the tool 20-35 deg away from vertical puts the end-effector ~5-6 cm
    nearer the robot and ~1 cm lower for the SAME fingertip point, which turned
    every point inside the open cabinet drawer (x in [-0.06, 0.04], y in
    [-0.04, 0.02], fingertips at z = 0.80) from unreachable into reachable for
    BOTH arms. Sweep pitch before concluding a target is out of range.
  fold_limit_y: -0.22            # pulling a handle toward the robot with a
                                 # horizontal front pinch, the end-effector
                                 # cannot retract past y ~ -0.22 in ANY wrist
                                 # orientation; the handle stops ~12.5 cm short
                                 # of that, so ~y = -0.09 is as close as a
                                 # dragged handle gets

gripper:
  fraction_convention: "0.0 = fully closed, 1.0 = fully open"
  finger_links: [link7, link8]   # measured 2026-08-27: BOTH arms use these two
                                 # names (one URDF loaded twice), so contacts
                                 # can only be attributed to an arm by entity
                                 # identity, never by link name
  contact_query_note: |
    RoboTwin's own get_gripper_actor_contact_position matches by entity NAME.
    It therefore (a) cannot tell the hands apart and (b) never matches an
    articulation, whose contacts are reported under its LINK names
    (036_cabinet -> base, link_0..link_3). check_grasp() in this adapter
    matches by Entity.per_scene_id and can require a particular link.

tool:
  axis: local +x points along the approach direction (out of the gripper)
  topdown_note: a top-down grasp has the local X-axis pointing down
  tcp_note: get_tcp_pose() is the point BETWEEN the fingertips, well below the end-effector frame
  tcp_offset_m: 0.12             # verified on both arms 2026-08-27:
                                 # get_tcp_pose() == get_gripper_pose_*() + 0.12 * R @ [1,0,0]
  held_object_note: |
    The gripper does NOT hold objects at their centre. A 5x8x5 cm box picked
    with the annotated top grasp sits 0.19 m from the end-effector along the
    tool axis — 7 cm BEYOND the fingertips — and it slips and swings while
    carried. Aim the object, re-measuring get_object_pose() against
    get_gripper_pose_*() at every waypoint, not the hand.

planner:
  kind: mplib RRT (default) or curobo (piper_curobo variant)
  obstacle_avoidance: true
  wall_clock_budgets: true      # planning_time / max_attempts are time-bounded -> replays need a quiet host
  generous_env_var: CAPX_PLANNER_GENEROUS
  screw_ignores_obstacles: true # measured 2026-08-27: mplib 0.2's plan_screw
                                # skips its own collision check and the planning
                                # world holds only table/wall/ground, so a glide
                                # into the table reports Success and stops where
                                # the physics stops it (0.24 m short, once)
  rrt_failure_cost_s: [20, 30]  # a FAILED RRT burns the whole planning budget;
                                # loops that stall by construction must servo
  screw_bow_cm_at_8cm: {0deg: 0.3, 30deg: 0.7, 60deg: 1.2}  # chord deviation of a
                                # translate-and-rotate glide over 8 cm (end link 12 cm
                                # off the screw axis); a pure translation ends 1.3-3.6 mm off
  screw_min_twist: 1.0e-4       # mplib stops on |twist| < 1e-4 BEFORE checking arrival:
                                # a zero-length glide and a 0.1 rad qpos_step remainder
                                # both read 'screw plan failed' (glide handles both)
  ee_pivot_behind_tcp_m: 0.12   # an in-place reorientation pivots about the EE frame,
                                # a held object sweeps ~0.12*sin(angle)
  world_is_a_reset_snapshot: |
    Each arm's mplib planning world is built inside robot.set_planner(), which
    runs while the robot resets - BEFORE the task spawns its props - and
    update_from_simulation() is never called again. Read back at any point of an
    episode (handover_mic, put_object_cabinet, 2026-08-27) it holds exactly
    table_6 / wall_5 / ground_1 and the two arm articulations. So "collision-free"
    means clear of the table, the wall and the other arm; a prop in the way and a
    payload in the jaws are both invisible. get_planner_world(arm) prints it.
  avoid_in_planner_works_carry_cannot: |
    avoid_in_planner(object) adds a prop to both arms' worlds with its pose kept
    live, and that IS checked correctly: the arm's own collision links are in the
    world frame (verified - the box in the jaws collides with link7/link8 at its
    true pose). carry_in_planner(object, arm) would attach the payload to the
    gripper link, but on mplib 0.2.1 an ATTACHED body is placed from the arm's
    BASE-frame pinocchio link pose: with the right base at (0.30,-0.45,0.75) Rz90,
    get_attached_link_global_pose() reported (0.162,0.488,0.121) for a hand at
    (-0.188,-0.288,0.871). A correctly measured 0.139 m relative pose still put the
    box a metre away, inside wall_5, and every later plan failed with "IK Failed";
    the error is A^-1*B*A, so no static relative pose fixes it. carry_in_planner
    measures that and REFUSES with the numbers. Both tools are opt-in: poses are
    refreshed before a plan only while something is registered, so a program that
    never calls them plans exactly as RoboTwin ships it.
  ik_probe_cost_s: [0.001, 0.03]  # ONE mplib IK query (20 CLIK seeds, collision-
                                  # checked against the planning world) vs 20-30 s
                                  # for a failed RRT: probe_reach sweeps
                                  # orientations with IK, never with plans
grasp_annotations:
  chosen_by_orientation_only: |
    RoboTwin's choose_grasp_pose ranks the annotated contact points by the
    angular distance of their wrist pose to the arm's "perfect" direction and
    never checks that the DESCEND onto the winner has an IK solution. So
    "grasp_object failed" is a statement about ONE pose, not about the object.
    find_grasp() plans approach + seeded descend for every (point, standoff)
    pair and reports which ones work.
  grasp_dis_is_the_reach_knob: |
    Measured on 018_microphone (handover_mic seed 0, 2026-08-27, deterministic
    budget): no annotated point of either arm plans at grasp_dis=0 for any
    pre_grasp_dis in 0.02..0.10 — the task's own expert fails there. Stopping
    0.02 m short of the contact point plans AND holds (left arm, points 3 and
    14: lift 5.7 cm, contact impulse 0.08). pre_grasp_dis moves only the
    approach pose; the descend target is the same for every value of it.
  grasp_dis_window_m: [0.02, 0.03]  # 0.02 holds; 0.03 plans and the fingers
                                    # close outside the body (lift 0.1 mm,
                                    # contact lost); 0.04 never touches.
                                    # Verify a searched grasp with a LIFT.
  plan_success_is_sticky: |
    Base_Task.plan_success is a sticky flag and Base_Task.move() returns
    without moving while it is False. A call that raises between its motion and
    _finish_plan used to leak it, and the NEXT call — an open_gripper, even —
    then reported "Motion planning failed ... the arm did not move" for a
    motion never attempted. That cascade decertified handover_mic in round 2.
    Every planner entry point now arms the flag on entry and reports its own
    failure before verifying contact.

contacts:
  contact_offset_m: 0.01        # PhysX lists a pair within the shapes' contact offsets:
                                # an OPEN gripper over a box reads points at +12 mm
                                # separation / zero impulse.  check_grasp counts a point
                                # only with impulse > 0 or separation <= 1 mm (a squeeze
                                # reads -0.9 mm / 0.14)

articulation:
  open_articulated_reached:      # fraction of joint travel, seed 0, 2026-08-27,
                                 # --planner-budget deterministic
    cabinet_drawer_ask_max: 0.77     # 155 planner calls, 35 s, grip slipped OUT
    cabinet_drawer_ask_0p70: 0.72    #  96 planner calls, 25 s, still gripping link_1
    microwave_door_revolute: 0.31    # 160 planner calls, 33 s, grip slipped OUT
  stall_is_often_a_turn: |
    A hinged part's tangent rotates as it opens, so a fixed pull direction
    reads as a mechanical stall within a few centimetres. Re-sweeping the
    direction on each stall took the microwave door from 0.12 to 0.31 and the
    cabinet drawer from 0.67 to 0.86.
  grip_does_not_survive_the_limit: |
    Driving a part to the arm's reach limit pulls the handle OUT of the
    fingers: the microwave door ends at 31 % with the gripper touching no link
    of it, and the cabinet drawer driven to 77 % likewise. Stopped at a target
    it can actually reach (0.70 -> 0.72) the gripper is still on the moving
    link. open_articulated measures this and reports holding/gripper_on_part
    rather than asserting it.
  open_only_as_far_as_the_goal_needs: |
    An over-extended part is an obstacle. At 0.86 of travel the cabinet drawer
    stands 15 cm proud; the placing arm brushes it to its stop and the scorer's
    functional point rides out from under the object just released on it —
    a 4 mm-accurate placement scored 0.0. Ask for the fraction the goal needs.
  neighbour_parts_follow: |
    Read all of get_joint_states(), not only the joint you aimed at: a far
    cross-body grip on a multi-drawer cabinet dragged the neighbouring drawer
    to 94 % alongside the target drawer.

situation: |
  You are controlling two Agilex Piper 6-DoF arms (parallel grippers) mounted
  on opposite sides of a table, by writing Python code against the API below.
  World frame: Z up. The LEFT arm reaches the x<0 side and the RIGHT arm the
  x>0 side; their workspaces overlap near the table middle, so objects can be
  handed over between arms. Object poses from the API are ground truth.

facts: |
  Environment mechanics:
  - Motions are planned (RRT); goto/grasp calls raise on planning failure —
    catch and retry from a different approach.
  - grasp_object()/place_object() are high-level helpers that use annotated
    grasp/functional points; prefer them over manual gripper choreography.
  - The annotated grasp the helper picks is chosen by wrist ORIENTATION alone
    and is never IK-checked, so one failure says nothing about the other
    points or standoffs. find_grasp(object, arm, ...) plans them all without
    moving and hands you the ones that work; stopping a centimetre or two
    SHORT of the contact point (grasp_dis) is often what brings a grasp into
    reach, and a wide object is still held there — verify with a lift.
  - A task that scores the grippers themselves reads the benchmark's own
    open/closed predicates, and those are thresholds on the LAST COMMANDED
    gripper fraction (> 0.8 open, < 0.2 closed), not on the fingers: a jaw
    clamped on a 5 cm object reads closed, open flips the instant open_gripper
    is issued, and a partial command (close_gripper(0.3)) is neither
    (measured 2026-08-27, handover_mic). get_gripper_state(arm) reports the
    predicates plus the measured finger joints; check_grasp says what is held.
  - move_by_displacement_*(move_axis="arm") ignores x and y (they raise) and
    moves the hand by z along its own approach axis, sign-flipped: z > 0 is a
    RETREAT along the fingers' direction — up after a top-down grasp, backward
    and level at the home pose (measured: x/y with "arm" moved 0.000 m).
  - The planner does NOT model whatever is in the gripper, and it cannot see a
    single task object: its world is a snapshot taken before the props were
    spawned and holds only the table, the wall, the ground and the two arms
    (get_planner_world(arm) prints it). So a planned transit can sweep the held
    object through a shelf, and route straight through a standing bottle.
    avoid_in_planner(object) puts an obstacle into that world (verified correct);
    a PAYLOAD cannot be put there on this mplib build - carry_in_planner()
    measures that and refuses - so lift the load clear before you travel and
    re-read check_grasp after every leg.
  - "Out of reach" usually means "you only tried pointing straight down".
    check_reachable_*/goto_pose_flex_* sweep wrist yaw, which is the wrong
    degree of freedom at the edge of the envelope; the fingertips sit a hand's
    length out along the tool axis, so tipping the tool moves the wrist several
    centimetres for the same fingertip point. probe_reach(arm, point) sweeps the
    dive angle with IK only — milliseconds per orientation, nothing moves — and
    the top-down orientation is the one that fails everywhere.
  - A functional point on a moving part (a drawer's interior, a lid's rim)
    TRAVELS WITH THAT PART. Opening a container does not merely give access,
    it moves the goal — usually toward the robot, into reach.
  - "Holding it" is a physics fact, not a return value. Both arms name their
    finger links link7/link8, so only entity identity can say WHICH hand is
    touching something, and an articulated object reports contacts per LINK —
    a finger on the cabinet's frame is not a hand on its drawer. Check with
    check_grasp(object, arm[, part=/contact_point_id=]) before you commit.
  - Loops that hunt (opening a drawer, searching orientations) must be bounded
    by a COUNT of motion calls, not by the wall clock: a time bound makes the
    same episode take a different path on a loaded host, and a replay is then
    not a replay. open_articulated's max_planner_calls is that bound.
