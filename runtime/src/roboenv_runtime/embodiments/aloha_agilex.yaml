# ALOHA-AgileX on RoboTwin 2.0 — the leaderboard robot, and the embodiment every public
# RoboTwin checkpoint is trained on.  One dual-arm URDF (arx5 description) instead of the
# two separate Piper arms our own certificates were earned on.
# Numbers marked (measured) were read from a live episode on 2026-08-28; the rest come
# from assets/embodiments/aloha-agilex/config.yml.
simulator: robotwin
description: >
  One dual-arm ALOHA-AgileX (two 6-DoF arms with parallel grippers on a single mobile
  base) facing a table.  Used for pretrained-policy runs (`vla_run`); the harness's own
  primitives and certificates use the `piper` profile.
arms: [left, right]
frame:
  quaternion_order: wxyz
  up_axis: z
  table_z: 0.74
  base_xyz: [0.0, -0.65, 0.0]   # config.yml robot_pose — ONE base, not two
  dual_arm_embodied: true       # both arms belong to the same robot
  note: >
    The Piper profile's two arm bases at z = 0.75 do NOT apply here: this base stands on
    the floor and the arms reach up over the table edge.  Joint angles are therefore not
    interchangeable between the two profiles — the same 14-vector puts the ALOHA hands
    about 7 cm below the table if it is replayed on Piper.
gripper:
  fraction_convention: "1.0 = open, 0.0 = closed (RoboTwin's normalised gripper value)"
  stroke_m: [-0.01, 0.045]      # config.yml gripper_scale
  bias: 0.12
tool:
  axis: "the arm's link6 z axis"
  joints_per_arm: 6
  action_vector: >
    14 = left arm 6 + left gripper 1 + right arm 6 + right gripper 1, the order
    RoboTwin's `joint_action.vector` and every RoboTwin checkpoint use.
planner:
  kind: curobo
  note: >
    config.yml sets `planner: curobo`; the mplib RRT tuning and wall-clock budgets in the
    `piper` profile were measured on Piper and do not transfer.
situation: |
  You are controlling one ALOHA-AgileX dual-arm robot (two 6-DoF arms, parallel
  grippers, shared base in front of a table) in RoboTwin 2.0, by writing Python.
  This is the embodiment RoboTwin's public policy checkpoints were trained on.
facts: |
  Environment mechanics:
  - One robot, two arms: the base stands on the floor at (0, -0.65, 0) and the arms
    reach over the table, whose top is at z = 0.74.
  - Joint actions are 14 values: left arm (6) + left gripper + right arm (6) + right
    gripper. Gripper 1.0 is open, 0.0 closed.
  - Motions are planned with curobo; a plan can fail and raise — catch and retry.
  - The harness's Piper primitives were tuned on a different robot; verify poses by
    reading them back rather than trusting a Piper-calibrated offset.
