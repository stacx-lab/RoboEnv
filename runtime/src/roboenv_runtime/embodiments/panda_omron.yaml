# Franka Panda on an Omron mobile base — RoboCasa365's default robot (robosuite "PandaOmron").
# The first embodiment with a mobile base: the arm workspace moves with the base, so an
# agent must first drive near a fixture, then manipulate.
simulator: robocasa
description: Franka Panda arm with a parallel gripper on an Omron LD-60 mobile base, in a kitchen.
arms: [right]

frame:
  quaternion_order: wxyz
  up_axis: z
  note: kitchens are room-scale; fixtures (counters, cabinets, sink, stove ...) are named, objects sit on/in them

workspace:
  reach_from_base_m: 0.85     # rough Panda reach; drive the base within this distance of a fixture first
  shoulder_z_m: 1.033         # robot0_link1 above the floor; robot0_link0 sits at the base body origin, z 0.70
  base_footprint_m: {x: [-0.55, 0.15], y: [-0.25, 0.25]}   # mobilebase0_pedestal_feet_col in the base heading frame: the box (half 0.35 x 0.25, 0.38 m tall) is centred 0.20 m BEHIND the base body (omron_mobile_base.xml wheeled_base pos -0.20; re-measured in sim 2026-08-27)
  base_front_edge_ahead_of_shoulder_m: 0.15   # and 0.55 m behind it
  comfortable_standoff_m: 0.7 # low targets (drawer handle z 0.74) reached from 0.73 m, stalled 2.4 cm short from 0.6 m (the wrist folds under the counter edge)
  torso_lift_m: 0.34            # mobilebase0_joint_torso_height, JOINT_POSITION kp 2000: shoulder z 1.033 -> 1.375 in ~30 steps (measured 2026-08-27); resets to 0, cannot go lower
  base_push_force_n: 600        # wheel actuators forcerange +-600: the pedestal (0.38 m tall) closed the 22 kg dishwasher door (40 Nm) in 5 x 10 cm pushes
  base_velocity_response: "soft friction knee, not a hard deadband (cm/step, 20-step bursts): 0.1 -> 0.01, 0.2 -> 0.02, 0.3 -> 0.2, 0.4 -> 0.6, 0.5 -> 1.0, 1.0 -> 2.2-3.5 fwd (asymmetric fwd/back), 1.0 lateral -> 3.4; turn channel linear (0.3 -> 0.8 deg/step, 1.0 -> 3.8 deg/step); drive_to keeps |cmd| >= 0.5; a pure turn drifts the base ~0.1 m per rad"

gripper:
  fraction_convention: "0.0 = open, 1.0 = closed (robosuite gripper action -1..1 mapped from this)"
  binary: true                # any command < ~0.25 opens fully, >= 0.25 closes fully; no partial opening (measured 2026-08-27)
  finger_actuator_force_n: 20 # position servo kp 1000: on a 1.5 cm bar the pinch is ~7 N per finger
  pad_behind_site_m: 0.012    # seat a bar pinch this deep past the bar's rear face and the pull is carried by the pad faces
  max_opening_m: 0.085
  closed_on_nothing_m: 0.010
  pad_half_height_m: 0.008    # pads span -1.2 .. +0.4 cm along the tool axis from the grip site
  fingertip_beyond_site_m: 0.011
  hand_body_behind_site_m: 0.073
  symmetric: true             # finger axis x and -x are the same grasp; the *_grasp_quat tools pick the nearer

tool:
  axis: eef site z points out of the gripper
  eef_site: gripper0_right_grip_site

arm_posture:
  ik: "solve_arm_ik: DLS on the 7 arm joints, ~17 seeds + 6 deterministic restarts, both finger twins, joint columns dropped on a limit; ok = < 5 mm, < 3 deg, > 0.03 rad from every limit; each ok candidate's straight joint path is collision-tested on a kinematic copy (path_clear)"
  posture_walk: "goto_pose_posture: 16 FK waypoints of the joint-space line fed to the OSC with its null-space spring re-pointed per waypoint: 0.03-0.06 rad path residual, ~230 frames; stops when the residual passes 0.25 rad (a collision / another wrist branch) instead of winding joint 7 on the final pose"
  tool_forward_limit: "with q6 = 2.9 the tool still points down-forward [0.04, 0.48, -0.88]; the horizontal-forward tool needs joint 6 past its 3.75 limit in the elbow-up family, so only forearm-wound solutions (joint 5 at -2.6..-2.9) exist and the servo drives joint 5 onto its stop there; pitch the tool 0.8 rad down instead (0.43 rad of margin, measured on the stove 2026-08-27)"
  home_q: [0.0, -1.02, 0.0, -2.26, 0.03, 1.51, 0.71]

knob_turning:
  stove_tab: "1.3 x 1.8 x 3.9 cm box, centre 5 mm proud of the knob anchor plane (tip 1.4 cm proud), dial face 2 mm behind it; the pinch that held: grip site 2 mm inside the tab tip plane, 1.2 cm above the tab centre, tool pitched 0.8 rad, fingers closing across the 1.3 cm (opening 0.022); 4 mm deeper the finger's upper edge meets the dial face and the approach stalls 4-5 cm short"
  strokes: "0.4 rad wrist rolls about the knob axis move the knob 0.35-0.41 rad each on a fresh grip; joint 7 runs out after ~0.6-1.0 rad per grip (a 2.2 rad turn needed 9 strokes and a re-grip: LowerHeat 1148 frames, over budget); the release with a free wrist flicked the tab 0.3 rad - retreat with the wrist held first"
  cost_frames: "stand_at 44, IK pre-pose walk ~230, pinch + 2 strokes + release ~120; TurnOnStove / ManipulateStoveKnob certified at 676 with one failed first pinch"

planner:
  kind: none (OSC pose deltas stepped in closed loop; the base is velocity-controlled)
  osc_output_max_m: 0.05      # default_pandaomron.json: the goal is at most 5 cm ahead of the hand, kp 150 - a few tens of N; doors needing 46-56 N at the handle (oven 21 Nm, dishwasher 40 Nm at the hinge) do not close
  base_motion: true
  control_freq_hz: 20

situation: |
  You are controlling a Franka Panda arm mounted on an Omron mobile base inside a
  simulated kitchen (RoboCasa), by writing Python code against the API below.

  World frame: Z up, metres. The kitchen is room-scale: counters, cabinets, drawers,
  the sink, stove, microwave and other fixtures have names; the objects the task
  mentions sit on or inside them. The arm reaches only about 0.85 m from the base,
  so move the base close to the fixture you need before manipulating. Object and
  end-effector poses from the API are ground truth; quaternions are WXYZ.

facts: |
  Environment mechanics:
  - There is no motion planner: goto_pose() servos the end-effector with small
    pose deltas and raises if it stalls; base_move() drives the base by a
    displacement in the base frame. Both consume the step budget.
  - Grasp with close_gripper() after positioning the fingers around the object;
    verify with get_object_pose() that the object rises with the hand.
  - The episode has a fixed step budget (the task horizon); the benchmark's own
    success check is the only score. The horizon is ADVISORY (ignore_done): a
    program can run past 1000 frames and still be scored, and the record is
    flagged OVER BUDGET.
  - Position-only goto_pose (quaternion_wxyz=None) reaches far more than any oriented
    wrist: the kettle lid button at z 1.171 stalled 4.5 cm short with a top-down
    quaternion and was pressed in 13 steps without one (measured 2026-08-27). Omit
    the quaternion whenever you only need to push.
  - The torso lifts the arm 0.34 m (set_torso_height) and the base pushes with 600 N
    (close_door_with_base closed the 22 kg dishwasher door the arm cannot); vertical-hinge
    doors are closed fastest with position-only fist strokes along the arc (push_door_shut:
    microwave 498-531 frames vs 1438 with the wrist rotating; fridge 677). The standing
    spot for an arc scales with the door: ~0.55 m from the bar for a 0.3 m microwave door,
    0.72 m for the 0.69 m fridge door (0.55 rammed it open, 0.8 left every stroke target
    beyond the 0.85 m arm reach; measured 2026-08-27). find_standing_pose reads the
    shoulder height LIVE, so a torso lift counts. close_door_with_base is for drop-down
    doors whose panel reaches the 0.38 m pedestal: it refuses a vertical hinge (driven into
    the open fridge door it rammed it fully open), a panel above the pedestal (the oven at
    66 deg: the base jammed under it) and a door open past ~72 deg, with 0 frames spent.
    A flush button on a vertical panel needs the fingertips pointed at it (press_part
    orients sideways presses); press_part is certified on the microwave buttons and the
    kettle lid button only - the toaster lever (0.9 of its travel needed) and the blender's
    diagonal button are not solved by it.
  - get_goal() decodes what the task scores (door fractions with the scorer's thresholds, a
    stove knob's raw-qpos window, an appliance's get_state key, the 0.15 m gripper_far rule)
    and reads _check_success live; get_instruction()/get_episode_meta() carry the knob, the
    left/right or the pull/push sense that only the language names. A knob is turned by
    turn_knob (pinch the tab with the tool pitched 0.8 rad, roll the wrist about the axis):
    TurnOnStove certified at 676 frames; a turn longer than ~1 rad needs re-grips at ~250
    frames each (TurnOffStove / LowerHeat ran over budget). goto_pose_posture reaches a wrist
    through the IK posture and a joint-space path (solve_arm_ik costs no steps); the
    horizontal-forward tool does not exist for this arm without winding joint 5 to its stop.
  - A hinge door is opened by a HOOK, not a friction pinch: open_door seats the pads
    1.2 cm + the bar's half extent behind the bar (fingertips 4 mm off the panel) -
    a wall-cabinet door that rubs its frame (~4 Nm) slid out of a centred pinch after
    one stroke and opened 0 -> 0.91 in eight strokes seated. Bars standing < 1.5 cm
    off their panel (microwave, fridge) cannot be seated: their pull is friction only
    (the per-joint report's seat.seated says which).
