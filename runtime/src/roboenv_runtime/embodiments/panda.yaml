# Franka Emika Panda as used by LIBERO-PRO (robosuite 1.4 / MuJoCo) and, later, RoboCasa.
simulator: libero
description: A single Franka Emika Panda arm with a parallel gripper at a tabletop scene.
arms: [arm]

frame:
  quaternion_order: wxyz
  up_axis: z

planner:
  kind: PyRoKi IK server (port 8116)
  obstacle_avoidance: false
  servers: {sam3: 8114, contact_graspnet: 8115, pyroki: 8116}

situation: |
  You are controlling a single Franka Emika Panda arm (parallel gripper) at a
  tabletop scene, by writing Python code against the API below. World frame:
  Z up. Object poses from the API are ground truth.

facts: |
  Environment mechanics:
  - Motion goes through a planner; motion calls raise on failure — catch and
    retry from a different approach pose.
  - All poses are in the ROBOT BASE frame (get_object_pose, get_body_positions,
    goto_pose targets, move_by_displacement); quaternions are WXYZ. goto_pose
    targets the fingertip midpoint. The tool-down orientation is [0, 1, 0, 0]
    (fingers close along base y); rotate about z to change the closing direction.
  - goto_pose is an IK move with no collision avoidance. It now closes the loop on
    the measured fingertips and RETURNS position_error_m, orientation_dev_deg,
    reached and tcp: read `reached` before you close the gripper (goto_pose_closed
    re-solves until it arrives; plain goto_pose is one solve and undershoots).
    A pose the IK
    solves is not always a pose the arm reaches — a hand pushing into a drawer
    wall stops 3-9 cm short with the position error to prove it.
  - Pitch is the reach degree of freedom. A LEVEL wrist has no IK solution low
    over the table: at base-frame z 0.03 the residual is 4.3-4.6 cm, while the
    same point solved exactly with 15 deg of downward pitch (measured on the
    white cabinet's bottom drawer, 2026-08-27). reachable_tool_quat(points,
    point_dir) picks the flattest pitch that reaches, and the articulation
    primitives use it.
  - Verified primitives (LIBERO, 2026-08-27). They are closed-loop: each one
    measures the result and tells you whether it worked, so branch on the report
    instead of assuming.
    * grasp_object(name) picks the whole grasp for you from the object's own
      collision geometry (plan_pinch): a bowl or plate by its rim, a moka pot by
      its handle, a carton across its body, and it avoids directions where a
      fingertip would land inside the object or against a drawer wall. It lifts
      and verifies; retries lower if the jaws closed on air.
    * place_on(obj, support) / place_on_region(obj, region) / place_in_region(
      obj, region) put the HELD object down. They aim the OBJECT (not the
      fingertips), keep it centred while it descends, and stop pressing the
      moment the support starts to slide.
    * open_articulated(joint, 0.9) pulls a drawer/door open; close_articulated(
      joint, target_qpos) pushes it shut with closed fingers; turn_knob(joint,
      target_qpos=...) pinches a dial and rotates the wrist about the joint axis.
      Both pitch the wrist down as far as the IK needs and report pitch_deg; call
      park() afterwards so the next motion does not start inside the drawer.
    * fit_yaw(obj, region) says how far a held object must be turned about the
      vertical to fit a compartment, and turn_held(deg) turns the wrist that far;
      place_in_region(obj, region, mode="seat") lowers the object until ITS OWN
      bottom is a centimetre off the region floor and lets go there, for slots the
      finger pads cannot enter.
    * push_object(obj, direction, distance) shoves a resting object with the
      closed gripper (nudge it off a rim, tip it against a wall).
    * place_gently, move_by_displacement, carry_to, descend_over, check_reachable,
      reachable_tool_quat, park, checkpoint()/restore() (practice only).
  - Observations that the cameras and get_object_pose do not give you:
    * get_object_extents(name) - the object's measured bounding box, top and
      bottom (use it for grasp heights and placement clearances).
    * get_region_boxes() - the named box regions the BDDL goal is scored against
      ("In" = the object's centre inside the box; "On" = just above its top face
      AND, when the region has a "parent" fixture, touching it - table/floor
      patches have no parent and need no contact). Aim at these, not at
      eyeballed coordinates; a table patch's top_z can sit ~2 cm BELOW where
      objects rest (release at the object's own measured bottom_z instead).
    * get_joint_info() - range/type/axis of every articulated joint (get_joint_states
      gives only the value); body_position(name) and get_body_positions() reach the
      second instance of a type (plate_2, moka_pot_2), which get_object_pose cannot.
    * in_contact(a, b) - the contact the "On"/"In" predicates require.
    * get_step_budget() - see below.
  - The episode has a HARD 4000-step budget: LIBERO raises "executing action in
    terminated episode" the moment you pass it and the program dies. Check
    get_step_budget() before a second attempt. Measured costs: grasp_object 500-800,
    place_on/place_in_region 600-900 (1800-2350 with a long place_gently descent),
    open_articulated 900-1500 (up to 2800), close_articulated ~250 per stroke,
    turn_knob 1100-2000, goto_pose 50-250, open_gripper 40, close_gripper 60,
    park ~50-225, turn_held ~150, push_object 650-720 (first push; ~350 from the
    contact), place_in_region(mode="seat") 480-1150. Dropping an object the last
    centimetre instead of lowering it gently is the single biggest saving there
    is: place_in_region(mode="drop") costs ~310 steps against ~2000 for "lower".
    Finger geometry (collision meshes, hand frame about the fingertip midpoint,
    measured 2026-08-27): the finger mesh spans -0.0375..+0.016 m along the tool
    axis, each finger is 0.0265 m thick OUTBOARD of its pad face and 0.021 m wide,
    the hand body's box begins 0.024 m above the fingertip midpoint and spans
    +-0.104 m along the close axis - a pad point that clears a drawer wall by a
    few mm can still have the finger body inside it (plan_pinch probes the outer
    face and reports outer_clearance_m).
    Every primitive clamps itself to the steps left and reports budget_exhausted,
    and so do the raw goto_pose/open_gripper/close_gripper tools now.
  - Promoted helpers (2026-08-27, from the libero-90 solution preludes; do not
    re-implement them): get_hand_pose()/tcp() (tcp is the API's TOOL POINT, 10 cm
    along the tool from the wrist; the finger tips reach 1.6 cm PAST it — the
    "fingertips" key — so the lowest safe tcp over a surface is surface + 0.016),
    frame_quat_wxyz / tool_down_quat_wxyz / tool_horizontal_quat_wxyz /
    tool_pitched_quat_wxyz / quat_wxyz_to_mat / mat_to_quat_wxyz, grasp_at(point,
    quat, approach_m, object_name=, lift_m=) (closed-loop hover, staged 5 cm descent
    that treats a leg drifting > 1 cm sideways as a stall and re-seeds the IK once,
    close, lift-verified: ~300-450 steps + 30-100; refused below 450 steps left),
    lift_check(object, lift_m >= 0.03) (held = the object rose > 60 % of the hand's
    rise; the finger gap is never the test; ~30-100 steps for 1-15 cm, measured
    2026-08-27; reason says hand_did_not_rise / object_stayed / partial_slip),
    rim_pick(bowl) (wall-straddling pinch, 4 sides x 4 radial offsets, IK-gated,
    400-700 per attempt; a one-sided rim pinch tilts a flat object by rim/diameter —
    a 1.9 cm plate hung vertical, a bowl 17 deg — tilt_deg is reported and > 45 deg
    is not a hold), box_pick(object) (across the object's OWN short side — its
    horizontal principal axes, so a yawed box is not measured on its AABB diagonal;
    depth capped so the 16 mm of finger past the tool point stays off the table),
    top_pick(pot) (body origin, the close axis chosen from the parts at the pinch
    height so a body wider than the 77 mm jaw is refused — the moka pot is 81 mm
    across x and 66 mm across y; exact hover, stalled descents abandoned),
    get_object_parts(object) (every collision geom of the body AND its sub-bodies
    with body/joint, centre, three half sizes for every geom type, axes: how a pan's
    handle bracket, a bottle's cap or a microwave door's bars are found),
    travel_height(object, clear_z, clearance_m), place_at(object, target_xy,
    support_top_z) (500-900), recentre_on(object, support) (0 when within 15 mm, else
    900-1400 per hop), tilt_held(deg, axis=) (rotate the held object about a
    horizontal axis through the fingertips, verified; 150-400), articulation_outward(
    joint) (a drawer's opening direction and outer face from its cloud projected on
    the joint axis vs its own origin — rotation-invariant, right on the wooden cabinet
    yawed -117 deg where the AABB rule flipped it; lean_m is 7.5 mm on a LIBERO
    drawer), push_close(joint) (verified 2-3 cm increments, ~240 per blocked step,
    stops after two stalled steps, hand left pressing), press_face(joint) (deep
    one-shot commands from a front seat, ~300 per try), wait(steps) (returns
    {{steps, budget_exhausted}}; robodojo/robocasa's wait returns None).
  - Hand geometry decides low work: the hand spans +-10.4 cm along the finger-closing
    axis and ~2 cm across it. A horizontal tool with VERTICAL fingers stands on the
    table at a bottom drawer's handle height (z 0.034) - that, not the IK, stalled
    every level push there; with the fingers laid ALONG the face the same drawer
    closes in one 22 cm level stroke (-0.151 -> +0.0016, 991 steps, libero.90_22).
    close_articulated / push_close / press_face / push_object take close_dir. The
    bottom drawer's PULL stays impossible: its bar can only be pinched with vertical
    finger travel.
  - (Close) margins do not survive letting go: the same drawer, same code and seed,
    kept +0.0016 after the retreat in one process and relaxed to -0.0065 in another.
    End a closing task with the hand PRESSING (close_articulated(park_after=False)),
    and do the close last. A bowl dropped into an open drawer moved it 5 cm toward
    the cabinet (-0.150 -> -0.099): re-read the joint after placing into a drawer.
    A shut drawer under an OPEN one is approached from the front, never from above
    (a straight descent onto its face swept the arm through the open drawer and
    shut it); push_close/press_face do that themselves.
  - Far-side descents (x ~0.72) stall 2-8 cm short with 11 deg of orientation error
    while check_reachable says the point is exact. Near the base (x ~0.31) the OLD
    one-shot descent diverged (approach_error inf); the staged 5 cm descent reaches
    the ketchup there and box_pick holds it in one attempt (632 steps, measured
    2026-08-27 on libero.90_47's scene). grasp_at/top_pick descend in 5 cm legs and
    re-seed the solver on a stall — only when the seedless branch is within 1.2 rad
    of the current posture.
  - Round 4 (2026-08-27). The PALM bounds a top-down pinch: the hand body begins 2.4 cm
    behind the tool point and spans +-10.4 cm along the closing axis, +-1 cm across; a
    pinch deeper than that under the object's highest material stalls exactly there
    (wine bottle, 15.7 cm: a pinch 4 cm above the base ends 11 cm short and the same
    descent with the bottle removed reaches to 1 mm). palm_clearance(point, quat, object)
    reports clear/retreat_m; top_pick(palm_check=True, default) raises a blocked fraction
    to the deepest clear height (the bottle: a neck pinch, held first try, 454 steps).
    Far reach is a wrist-yaw problem: at x 0.72 the handle pinch closing along x descends
    where the body pinch closing along y stalls 3-8 cm short (grasp_object 3/3 first
    attempt on the moka pot); the y-closing tool-down descent to z 0.03 already stalls at
    x 0.60 with nothing in the way. A hinge door the arm cannot pull past ~40 deg is
    finished by PUSHING its inner face: close_articulated(joint, target_qpos=<open value>,
    stroke=0.12, standoff_m=0.04, park_after=False) — microwave -0.66 -> -1.63 in three
    strokes, 2331 steps for the whole open (level pull 3 x 6 cm first: 1129 steps; the
    4th pull stroke at y 0.21 moves nothing and a re-grasp there shuts the door 0.15 rad);
    open_articulated reports hand_moved_m per stroke and re-hooks via park() (rehooks)
    when neither the part nor the hand moved. insert_flat_into_region(object, region)
    is the 90_86/88 front-loading manoeuvre in one call (open face measured by clearance
    probes on the region box, carry height from the box floor + half thickness + the
    2.65 cm lower finger + 6 mm; ~1300-1700 steps; a pitched wrist tilts the object by
    the same angle — there is no pitched level carry). get_goal_predicates() gives the
    parsed BDDL goal; place_on(retries=) hops a residual over xy_tolerance_m;
    place_on/place_on_region/place_in_region(scored_name=) judge the predicate on the
    named body; align_held_to_region(object, region) tilts a held object onto a rolled
    site's axis (the wine rack: 62 deg, one tilt_held). LiberoAdapter(init_order=
    "benchmark") applies the benchmark's own init state after cap-x's reset (opt-in:
    every certificate was earned on cap-x's layout; libero_10_with_milk/2 is broken in
    its BDDL either way — basket 2.7-3.2 m off, milk 9-11 m up).
  - LIVING_ROOM_SCENE1/2/3 props spawn in the air (the ketchup 0.55 m up): still at
    z 0.63 after the reset's own settle, on the table by control step ~15 (measured
    2026-08-27 step by step). wait() a few steps and poll body_position until it stops
    changing before pinching; do not wait a fixed 150. A region
    box rides with its fixture: a basket tipped by a pitched hand collapsed its
    In box to a 6 mm slab; place_in_region re-reads the box after the release.
