name: integration_probe
kind: controller
description: Read a real camera, move one native arm by a small measured amount, and stop.
timeout_s: 150
devices: [joint]
parameters:
  type: object
  additionalProperties: false
  required: [arm, camera]
  properties:
    arm: {type: string}
    camera: {type: string}
device_inputs:
  arm: {types: [joint]}
  camera: {types: [rgb, rgbd]}
