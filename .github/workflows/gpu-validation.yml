name: Trusted manual simulator validation
on:
  workflow_dispatch:
    inputs:
      backend:
        description: Prepared backend to validate
        type: choice
        options: [libero, robocasa, robotwin, robodojo, behavior]
        default: libero
        required: true
      mode:
        description: Connectivity is not solved-task evidence
        type: choice
        options: [probe, reference]
        default: probe
        required: true
      case:
        description: Optional exact task ID from the built-in or operator task source
        type: string
        default: ""
      seed:
        description: Nonnegative episode seed
        type: string
        default: "0"
        required: true
permissions:
  contents: read
concurrency:
  group: trusted-gpu-validation
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: gpu-validation
    runs-on: [self-hosted, linux, x64, roboenv-gpu]
    timeout-minutes: 180
    env:
      VALIDATION_BACKEND: ${{ inputs.backend }}
      VALIDATION_MODE: ${{ inputs.mode }}
      VALIDATION_CASE: ${{ inputs.case }}
      VALIDATION_SEED: ${{ inputs.seed }}
      DEPLOYMENT_MAP: ${{ vars.ROBOENV_GPU_DEPLOYMENT_MAP }}
      TASK_SOURCE: ${{ vars.ROBOENV_GPU_TASK_SOURCE }}
      ROBOENV_GPU: ${{ vars.ROBOENV_GPU_DEVICE }}
      VALIDATION_OUT: .cache/gpu-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Bootstrap and verify CPU/package contracts
        run: |
          bash tools/bootstrap.sh
          bash tools/check.sh
      - name: Validate one selected backend using standard Harbor Oracle
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_MAP" || { echo 'Configure the protected deployment map variable.'; exit 1; }
          args=(--deployments "$DEPLOYMENT_MAP" --sdk-wheel build/wheels/roboenv-0.2.0-py3-none-any.whl)
          args+=(--out "$VALIDATION_OUT" --backends "$VALIDATION_BACKEND" --modes "$VALIDATION_MODE" --seeds "$VALIDATION_SEED")
          if [[ -n "$VALIDATION_CASE" ]]; then args+=(--cases "$VALIDATION_CASE"); fi
          if [[ -n "$TASK_SOURCE" ]]; then args+=(--source "$TASK_SOURCE"); fi
          .venv/bin/python tools/validate_simulators.py "${args[@]}" --run
      - name: Audit the sanitized receipt before upload
        id: privacy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -c 'import json, os; from pathlib import Path; from roboenv.privacy import validate_public_text; p=Path(os.environ["VALIDATION_OUT"])/"receipt.json"; data=p.read_text(); validate_public_text(data,"receipt.json"); assert json.loads(data)["schema"] == "roboenv/gpu-validation/1"'
          mkdir -p build/gpu-validation
          cp "$VALIDATION_OUT/receipt.json" build/gpu-validation/receipt.json
      - name: Upload receipt only, never raw Harbor logs or deployment maps
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: simulator-validation-receipt
          path: build/gpu-validation/receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve failed validation status
        if: always() && steps.validation.outcome != 'success'
        run: exit 1
