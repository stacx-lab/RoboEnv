name: Trusted manual simulator validation
on:
  workflow_dispatch:
    inputs:
      backend:
        description: Prepared backend to validate
        type: choice
        options: [libero, robocasa, robotwin, robodojo, behavior]
        default: libero
        required: true
      mode:
        description: Connectivity is not solved-task evidence
        type: choice
        options: [probe, reference]
        default: probe
        required: true
      case:
        description: Optional exact task ID from the built-in or operator task source
        type: string
        default: ""
      seed:
        description: Nonnegative episode seed
        type: string
        default: "0"
        required: true
permissions:
  contents: read
concurrency:
  group: trusted-gpu-validation
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: gpu-validation
    runs-on: [self-hosted, linux, x64, roboenv-gpu]
    timeout-minutes: 180
    env:
      VALIDATION_BACKEND: ${{ inputs.backend }}
      VALIDATION_MODE: ${{ inputs.mode }}
      VALIDATION_CASE: ${{ inputs.case }}
      VALIDATION_SEED: ${{ inputs.seed }}
      TASK_SOURCE: ${{ vars.ROBOENV_GPU_TASK_SOURCE }}
      SIMULATOR_INTERPRETER: ${{ vars.ROBOENV_GPU_INTERPRETER }}
      # Exported below as CUDA_VISIBLE_DEVICES and MUJOCO_EGL_DEVICE_ID. A ROBOENV_* name
      # would never reach the world: launch strips every ROBOENV_* variable.
      VALIDATION_GPU: ${{ vars.ROBOENV_GPU_DEVICE }}
      VALIDATION_OUT: .cache/gpu-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false
          # Worlds launch from this checkout: keep the runner's prepared interpreters
          # (.venv-sim/) and their registrations (.cache/) instead of wiping them per run.
          clean: false
      - uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
      - name: Bootstrap and verify CPU/package contracts
        run: |
          bash tools/bootstrap.sh
          bash tools/check.sh
      - name: Sync the selected backend's pinned upstream sources
        run: .venv/bin/roboenv sources sync --backends "$VALIDATION_BACKEND"
      - name: Launch, replay and verify one prepared backend without a model
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # The runner prepares its simulators with `roboenv prepare BACKEND`; an operator may
          # instead name one prepared interpreter for the selected backend.
          if [[ -n "${VALIDATION_GPU:-}" ]]; then
            export CUDA_VISIBLE_DEVICES="$VALIDATION_GPU" MUJOCO_EGL_DEVICE_ID="$VALIDATION_GPU"
          fi
          args=(--out "$VALIDATION_OUT" --backends "$VALIDATION_BACKEND")
          args+=(--modes "$VALIDATION_MODE" --seeds "$VALIDATION_SEED")
          if [[ -n "$VALIDATION_CASE" ]]; then args+=(--cases "$VALIDATION_CASE"); fi
          if [[ -n "$TASK_SOURCE" ]]; then args+=(--source "$TASK_SOURCE"); fi
          if [[ -n "$SIMULATOR_INTERPRETER" ]]; then args+=(--interpreter "$SIMULATOR_INTERPRETER"); fi
          .venv/bin/python tools/validate_simulators.py "${args[@]}" --run
      - name: Audit the sanitized receipt before upload
        id: privacy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -c 'import json, os; from pathlib import Path; from roboenv.privacy import validate_public_text; p=Path(os.environ["VALIDATION_OUT"])/"receipt.json"; data=p.read_text(); validate_public_text(data,"receipt.json"); assert json.loads(data)["schema"] == "roboenv/simulator-validation/1"'
          mkdir -p build/gpu-validation
          cp "$VALIDATION_OUT/receipt.json" build/gpu-validation/receipt.json
      - name: Upload the receipt only, never the private log, journals or run records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: simulator-validation-receipt
          path: build/gpu-validation/receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve failed validation status
        if: always() && steps.validation.outcome != 'success'
        run: exit 1
