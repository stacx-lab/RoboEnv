name: Pinned source and task catalog
on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"
permissions:
  contents: read
concurrency:
  group: source-catalog
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false
      - uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
      - run: bash tools/bootstrap.sh
      - run: .venv/bin/roboenv sources sync
      - run: >-
          .venv/bin/python tools/release_preflight.py
          --mode development --verify-upstreams
      - name: Validate every discovered task with the real Harbor loader
        env:
          ROBOENV_TEST_UPSTREAMS: "1"
        run: >-
          .venv/bin/python -m pytest -c pyproject.toml --confcutdir=.
          tests/test_taskset.py::test_every_discoverable_upstream_task_passes_harbor_loader -q -s
      - name: Optional policy-client constructor regression (no Isaac)
        run: >-
          .venv/bin/python -m pytest -c pyproject.toml --confcutdir=.
          tests/test_robodojo_client_injection.py -q
