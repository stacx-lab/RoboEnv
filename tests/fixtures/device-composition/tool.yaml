name: device_composition_probe
kind: controller
description: >-
  Integration test fixture: retain hand and optional waist postures and compose body commands with
  independent arm IK in one loop of concurrent device calls. Wrist goals carry a reference frame.
  Does not plan paths, optimize waist posture, or certify balance/grasp success.
parameters:
  type: object
  additionalProperties: false
  properties:
    body:
      type: object
      additionalProperties: false
      required: [mode, velocity, posture]
      properties:
        mode: {const: locomotion}
        velocity:
          type: object
          required: [vx, vy, wz]
          additionalProperties: false
          properties:
            vx: {type: number}
            vy: {type: number}
            wz: {type: number}
        posture:
          type: object
          required: [height]
          additionalProperties: false
          properties:
            height: {type: number}
            roll: {type: number}
            pitch: {type: number}
            yaw: {type: number}
      description: Base motion command; defaults to zero velocity and profile-declared posture references.
    steps: {type: integer, minimum: 1, maximum: 1000, default: 50}
    segment_s:
      type: number
      exclusiveMinimum: 0
      default: 0.1
    goals:
      type: object
      additionalProperties:
        type: object
        additionalProperties: false
        required: [frame, pose]
        properties:
          frame: {type: string}
          pose:
            type: array
            items: {type: number}
            minItems: 7
            maxItems: 7
            description: wrist position and unit xyzw quaternion in frame.
devices: [world, velocity, joint, dexterous_hand]
timeout_s: 110
