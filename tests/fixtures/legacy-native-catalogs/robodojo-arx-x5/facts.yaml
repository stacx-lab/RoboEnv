# ARX X5 dual-arm embodiment as configured in RoboDojo (env_cfg arx_x5 / dual_x5).
# Numbers were measured in-sim during the 2026-08 campaigns (see docs/ and
# skills/knowledge/shared/arx_x5); every one of them used to be a literal in
# dojo_skills.py / dojo_v21.py or a prompt string.
simulator: robodojo
description: Two ARX X5 6-DoF arms with parallel grippers on a tabletop (RoboDojo default).
arms: [left, right]

frame:
  quaternion_order: wxyz
  up_axis: z
  table_z: 0.765
  arm_bases:
    left: [-0.3, -0.45, 0.765]
    right: [0.3, -0.45, 0.765]

workspace:
  spawn_x: [-0.45, 0.45]
  spawn_y: [-0.25, 0.0]
  prohibited_area_xyxy: [-0.15, -0.32, 0.15, -0.27]   # between the arm bases; stands here collide

gripper:
  max_opening_m: 0.088          # usable pad gap 0 .. ~0.088
  gw_saturated_m: 0.0498        # reported jaw width when fully closed on nothing (GW_SAT)
  gw_intercept_m: 0.0299        # affine fit: width = intercept + per_frac * frac, frac in [0.2, 1.0]
  gw_per_frac_m: 0.1079
  finger_offset_note: "eepos() reports the tip; the finger pads sit ~7.3 cm away (task-dependent axis) — read get_gripper_state()."

tool:
  axis: link6 +x
  topdown_quaternion_wxyz: [0.7071, 0.0, 0.7071, 0.0]
  yaw90_quaternion_wxyz: [0.5, -0.5, 0.5, 0.5]
  carry_note: carried objects hang below the fingertips

planner:
  kind: curobo-ik + straight cartesian path
  obstacle_avoidance: false
  tilt_hint_deg: [25, 30]
  yaw_sweep_hint_deg: [90, 180]

situation: |
  You are controlling a dual-arm robot (two ARX X5 6-DoF arms with parallel
  grippers) in a tabletop scene, by writing Python code against the API below.

  Coordinate system (world frame):
  - Z-axis is up; the tabletop surface is at z ~= 0.765.
  - The LEFT arm base sits at x ~= -0.3 and the RIGHT arm base at x ~= +0.3, both
    on the negative-Y side of the table (y = -0.45). Objects spawn roughly within
    x in [-0.45, 0.45], y in [-0.25, 0.0].
  - All quaternions are WXYZ order: [qw, qx, qy, qz].
  - Both arms can work; each has limited reach around its own base, overlapping
    near the table middle.

facts: |
  Environment mechanics:
  - The episode has a fixed simulation-step budget (see get_step_budget());
    every motion and wait consumes it, and the episode ends mid-action when it
    runs out.
  - Carried objects hang below your fingertips.

  Closed-loop primitives (verified 2026-08-26 on stack_blocks / store_laptop_and_headphones):
  - The reported fingertip is the BOTTOM of the pads; the pads rise ~7 cm above it. A
    pinch must put the tip BELOW the object's top (pick() now uses top - 1.2 cm); a tip
    1.5 cm above the top closes on air (jaw width 0.0498 = closed on nothing).
  - orientation(arm, tool, jaw) builds goto_pose quaternions from words ("down"/"left"/
    "forward"..., jaw "x"/"y"/"z"); get_tool_frame(arm) reports the ACHIEVED jaw/tool axes
    and goto_pose returns position_error_m and orientation_dev_deg - near the workspace
    edge (y >~ 0 for the X5) the wrist can be 20-60 deg off while the position is met.
  - reach_map(arm, xs, ys, z) probes a grid without moving; the arms reach y <= ~0.05
    (x >= 0 for the right arm, x <= 0 for the left) - the far half of the table (y >
    0.1) is out of reach for both, plan around it (drag objects closer first).
  - probe_surface(arm, x, y) lowers the closed tip until contact: the honest height of
    a surface the bounding box misrepresents (a tilted laptop base, a lid).
  - place_gently(arm, object) lowers the held object until it rests and releases:
    stacks blocks with ~1 mm xy error, no support height needed.
  - get_joint_states() / get_functional_points(label): the scorer's joint RATIOS
    (e.g. "closed" = ratio > 0.85) and the exact functional frames it measures
    (slots, cradles, bottoms); push_joint() is experimental.

  Flat tools and the wrist (verified 2026-08-27 on store_tools_in_toolbox):
  - joint6 (wrist roll) is limited to +-3.14 rad, every other joint wraps; the servo
    now takes the long way round the limit and goto_pose honours the requested
    orientation whenever a same-branch IK exists (orientation_dev_deg 0.0-0.1) - read
    that number, 20-60 deg means the wrist could not take the orientation there.
  - The exact tool-down orientation is NOT reachable over the table middle (x in
    [-0.02, 0.13], y > -0.05) for either arm at any yaw; lean the tool axis 20-30 deg
    about the jaw axis toward the arm (pick_flat(tilt_deg=20) does) and it is.
  - pick_flat / carry_held / align_held / seat_object: pinch at table + 2 mm with the
    jaw across the narrow side (the hold is verified at a 2 cm test lift AND at the
    full lift - a 2 cm lift does not predict an 8 cm one on a pivoting pinch; a failed
    pick reports how far it shifted the object), carry a well-centred pinch in one
    goto and a thin/off-centre part in 3 cm steps with carry_held (never re-close the
    gripper mid-carry: it drops the object), rotate the wrist so the held object's
    ROOT quaternion matches the target frame (the scorer compares the ACTIVE
    functional point's frame - identical only for identity-rotation points), and
    seat_object(container=<name>) lowers it until it rests and releases in stages
    (the rim height is measured from the container's bounding box, not assumed).
  - The oriented bounding boxes of objects resting on the table extend 5-8 mm BELOW
    the tabletop (hammer lo_z 0.760, wrench 0.757 vs table 0.765): bbox-derived
    support heights are unreliable, probe_surface is not.
  - Soft resets (same seed) re-home the arms at ~0.0195 rad/step before the objects
    are restored; every reset before one that saw the arm parked over a spawn point
    used to leave both arms jammed 0.3-1.0 rad off home.

  Mass centre, pad geometry and joint winding (verified 2026-08-27 on store_tools_in_toolbox):
  - A friction pinch is a pendulum: pick_flat(along="com") pinches on the centre-of-mass
    line (get_mass_properties reads it from physics; the wrench's is 1.95 cm from its
    origin) and the tool stays level (0.2 deg vs 14-26 deg at the origin). Only parallel
    flat sides hold: diverging handles or a round boss touch each pad at one point and
    roll at any offset (pliers: 18 deg on a 2 cm test lift 0.7 mm from the mass centre).
    get_object_profile(name) shows the width band by band.
  - Finger geometry (mesh, tip frame): each finger 8.6 cm long along the tool axis,
    3.7 cm thick in the jaw direction, 6.0 cm wide across; closed pads meet at the tip
    axis, fully open the pad gap is 8.7 cm. A pinched 2.5 cm part sits between fingers
    10 cm wide overall - they never enter a recess narrower than that; seat from the rim.
  - A flat pinch on parallel faces locks the object's yaw: drag it along the table
    (yaw within 3.5 deg over 30 cm) or turn it in place with 30 deg wrist-yaw steps.
    Keep a trailing end away from the arm's own base (the folded arm hits it).
  - Joint winding: joints 1-5 have +-10 rad limits in the USD and in cuRobo, so IK can
    return an elbow three turns round; a failed approach wound the left elbow to 5.9 rad
    and the arm jammed below the table through go_home and a soft reset. The servo now
    refuses non-roll solutions beyond +-(pi + 1.2) rad = 4.34 rad that have an in-limit
    alias a turn closer to zero (a 0.35 margin refused the store_tools hammer carry, which
    needs joints up to ~4.3 rad) and the soft reset writes the
    default joint state straight into the simulation (recovers a jammed arm in 30 steps).
  - go_home(arm) before every pick: a pick started from the previous tool's retreat pose
    ended 4.9 cm short; from home it succeeds.
  - Object bounding boxes (metadata) are TRUE oriented boxes: 288 of 748 assets have
    theirs rotated > 5 deg inside the asset frame (wrench 8, tape measure 10, hammer/00003
    11, screwdriver 44 deg). pick_flat(jaw="auto") and get_object_profile use the box's
    own edges (obb_edges), never the corners' local AABB. Pad gap fully open 0.087 m: an
    object whose narrowest side exceeds it is refused before any motion.
  - reach_orientations reports a wrist-FLIPPED solution (the 180 deg yaw twin the probe
    also tries) separately: it leans the opposite way and is not the requested pose.
