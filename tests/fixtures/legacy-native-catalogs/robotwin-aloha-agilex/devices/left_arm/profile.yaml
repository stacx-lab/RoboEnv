name: left_arm
type: manipulator
loaded: true
access:
  source: user
  kind: sim
  device: /run/roboenv/sim.sock
  driver:
    entry: driver.py
    interpreter: python3
    actions:
    - catalog
    - displace
    - fk
    - home
    - ik
    - load
    - move
    - read
    - state
    - status
    - stop
    - unload
    - write
    - invoke
    - policy_run
    timeout_s: 900
intrinsics:
  source: user
  needs_calibration: See facts.yaml. Joint FK/IK and precise flange transforms are
    not exposed by this primitive driver.
  dof: 6
  joints: []
  home_joints: ???
  actions:
  - component: x
    units: m
  - component: y
    units: m
  - component: z
    units: m
  - component: qx
    units: quaternion
    meaning: write.target uses xyzw; legacy move/native primitives retain wxyz
  - component: qy
    units: quaternion
    meaning: write.target uses xyzw; legacy move/native primitives retain wxyz
  - component: qz
    units: quaternion
    meaning: write.target uses xyzw; legacy move/native primitives retain wxyz
  - component: qw
    units: quaternion
    meaning: write.target uses xyzw; legacy move/native primitives retain wxyz
extrinsics:
  source: user
  mount:
    parent: world
    pose: ???
