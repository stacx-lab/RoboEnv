simulator: robotwin
description: 'One dual-arm ALOHA-AgileX (two 6-DoF arms with parallel grippers on
  a single mobile base) facing a table.  Used for device-driven runs;
  the harness''s own primitives and certificates use the `piper` profile.

  '
arms:
- left
- right
frame:
  quaternion_order: wxyz
  up_axis: z
  table_z: 0.74
  base_xyz:
  - 0.0
  - -0.65
  - 0.0
  dual_arm_embodied: true
  note: "The Piper profile's two arm bases at z = 0.75 do NOT apply here: this base\
    \ stands on the floor and the arms reach up over the table edge.  Joint angles\
    \ are therefore not interchangeable between the two profiles \u2014 the same 14-vector\
    \ puts the ALOHA hands about 7 cm below the table if it is replayed on Piper.\n"
gripper:
  fraction_convention: 1.0 = open, 0.0 = closed (RoboTwin's normalised gripper value)
  stroke_m:
  - -0.01
  - 0.045
  bias: 0.12
tool:
  axis: the arm's link6 z axis
  joints_per_arm: 6
  action_vector: '14 = left arm 6 + left gripper 1 + right arm 6 + right gripper 1,
    the order RoboTwin''s `joint_action.vector` and every RoboTwin checkpoint use.

    '
planner:
  kind: mplib_RRT
  note: "the embodiment's own config.yml asks for curobo, but roboenv.adapters.robotwin.embodiments\
    \ registers these envs with planner=\"mplib_RRT\" because curobo's prebuilt kernels\
    \ do not run on this host (\"no kernel image is available\") \u2014 so the planner\
    \ facts measured on Piper's mplib DO apply here, and the curobo tuning in the\
    \ embodiment profile does not\n"
situation: 'You are controlling one ALOHA-AgileX dual-arm robot (two 6-DoF arms, parallel

  grippers, shared base in front of a table) in RoboTwin 2.0, by writing Python.

  This is the embodiment RoboTwin''s public policy checkpoints were trained on.

  '
facts: "Environment mechanics:\n- One robot, two arms: the base stands on the floor\
  \ at (0, -0.65, 0) and the arms\n  reach over the table, whose top is at z = 0.74.\n\
  - Joint actions are 14 values: left arm (6) + left gripper + right arm (6) + right\n\
  \  gripper. Gripper 1.0 is open, 0.0 closed.\n- Motions are planned with curobo;\
  \ a plan can fail and raise \u2014 catch and retry.\n- The harness's Piper primitives\
  \ were tuned on a different robot; verify poses by\n  reading them back rather than\
  \ trusting a Piper-calibrated offset.\n"
